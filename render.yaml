# Render.com blueprint. A background worker keeps the bot connected.
# Do the first QR/pairing link locally, then mount the auth/ folder on a
# persistent disk so the worker reuses the session. Never commit secrets.
services:
  - type: worker
    name: cosmic-wa-bot
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node index.js
    envVars:
      - key: AUTH_METHOD
        value: qr
      - key: PREFIX
        value: "!"
      - key: LOG_LEVEL
        value: info
      - key: WEB_SERVER
        value: "false"
      - key: BOT_NUMBER
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
    disk:
      name: auth
      mountPath: /app/auth
      sizeGB: 1
